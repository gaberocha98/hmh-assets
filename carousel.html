<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>HMH Carousel</title>
<style>
  :root{
    --bg:#000;
    --fg:#f2f2f2;
    --muted:#7c8288;
    --accent:#1d9bf0;
    --pad:96px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg)}
  /* Each slide is exactly one IG portrait frame */
  .slide{
    position:relative;
    width:1080px;
    height:1350px;
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:0 var(--pad);
    overflow:hidden;
  }
  .card{
    display:flex;
    flex-direction:column;
    gap:44px;
    /* nudge the block slightly above true center, like the source */
    transform:translateY(-40px);
  }
  .head{display:flex;align-items:center;gap:26px}
  .avatar{
    width:104px;height:104px;border-radius:50%;
    object-fit:cover;flex:none;background:#333;
  }
  .who{display:flex;flex-direction:column;gap:5px;line-height:1.05}
  .name-row{display:flex;align-items:center;gap:12px}
  .name{font-size:50px;font-weight:700;letter-spacing:-.2px}
  .handle{font-size:44px;color:var(--muted);font-weight:400}
  .badge{width:44px;height:44px;flex:none}
  .body{
    font-size:46px;
    line-height:1.34;
    font-weight:400;
    letter-spacing:-.3px;
    white-space:pre-wrap;
  }
  .body b{font-weight:700}
  .slide.hook .body{font-size:60px;line-height:1.24;font-weight:500}
  .slide.cta .body{font-size:52px;line-height:1.3}
  .slide.cta .card{transform:translateY(0)}
  .cta-img{display:block;width:640px;max-width:90%;height:auto;margin-top:8px;align-self:center;
    filter:drop-shadow(0 30px 60px rgba(0,0,0,.55))}
  /* When rendering a single slide, only that one shows */
  body.single .slide{display:none}
  body.single .slide.active{display:flex}
</style>
</head>
<body>
<script>
/* Slide content. Use <b> for the bold runs from the source. */
const AVATAR = window.__AVATAR__ || "gabe-profile.jpg";
// Canonical identity — matches Gabe's Instagram profile. Keep in sync.
const NAME = "Gabe Rocha";
const HANDLE = "@gabexrocha";

const SLIDES = [
  { kind:"hook", html:`Two drinks on Reta hit like five.

If your tolerance fell off a cliff, you’re not crazy. Here’s what’s actually happening.` },
  { html:`Reta slams the brakes on how fast your stomach empties.

That one change rewires how alcohol moves through you and how hard it lands.

You end up wrecked on <b>half</b> of what you used to handle.` },
  { html:`The same three things come up over and over:

•  Getting drunk way faster

•  Hangovers that feel like a punishment

•  Nausea and reflux going through the roof` },
  { html:`And no, it’s not in your head.

Yale researchers found GLP-1s <b>cut down the enzyme your body uses to break alcohol apart</b>. So your blood alcohol climbs higher and camps out longer.

(npj Metabolic Health &amp; Disease)` },
  { html:`Here’s the part nobody connects:

losing weight quietly drops your tolerance too. Less body mass means less water to dilute the alcohol. Same drink, smaller tank, <b>higher concentration</b>.

You didn’t get lightweight. Your body changed the math.` },
  { html:`Stack on top of that: Reta kills your appetite, so you’re drinking on an <b>empty stomach</b> without even realizing it.

Nothing in there to slow it down means it hits faster and harder every single time.` },
  { kind:"cta", img:"cta-book.png", html:`Curious about Reta and the peptides everyone’s talking about?

Comment “PEP” for a free beginner’s guide.` },
];

const BADGE = `<svg class="badge" viewBox="0 0 22 22" aria-hidden="true"><path fill="#1d9bf0" d="M20.396 11c-.018-.646-.215-1.275-.57-1.816-.354-.54-.852-.972-1.438-1.246.223-.607.27-1.264.14-1.897-.131-.634-.437-1.218-.882-1.687-.47-.445-1.053-.75-1.687-.882-.633-.13-1.29-.083-1.897.14-.273-.587-.704-1.086-1.245-1.44-.541-.354-1.17-.551-1.816-.569-.646.018-1.275.215-1.816.569-.541.354-.972.853-1.245 1.44-.607-.223-1.264-.27-1.898-.14-.633.132-1.216.437-1.686.882-.445.47-.75 1.053-.882 1.687-.13.633-.083 1.29.14 1.897-.587.274-1.086.705-1.44 1.246-.354.541-.551 1.17-.569 1.816.018.646.215 1.275.569 1.816.354.541.853.972 1.44 1.245-.223.608-.27 1.265-.14 1.898.132.634.437 1.217.882 1.687.47.445 1.053.75 1.687.882.633.13 1.29.083 1.897-.14.274.587.705 1.086 1.246 1.44.541.354 1.17.551 1.816.569.646-.018 1.275-.215 1.816-.569.541-.354.972-.853 1.245-1.44.604.239 1.266.303 1.906.185.64-.118 1.232-.413 1.703-.848.435-.47.73-1.063.848-1.703.118-.64.054-1.302-.185-1.906.587-.273 1.086-.704 1.44-1.245.354-.541.551-1.17.569-1.816zM9.662 14.85l-3.429-3.428 1.293-1.302 2.072 2.072 4.4-4.794 1.347 1.246z"/></svg>`;

function render(){
  document.body.innerHTML = SLIDES.map((s,i)=>`
    <section class="slide ${s.kind||''} slide-${i+1}">
      <div class="card">
        <div class="head">
          <img class="avatar" src="${AVATAR}" alt="">
          <div class="who">
            <div class="name-row"><span class="name">${NAME}</span>${BADGE}</div>
            <span class="handle">${HANDLE}</span>
          </div>
        </div>
        <div class="body">${s.html}</div>
        ${s.img ? `<img class="cta-img" src="${s.img}" alt="">` : ""}
      </div>
    </section>`).join("");

  // ?slide=N -> single-slide mode (1-indexed) for exact-frame export
  const p = new URLSearchParams(location.search);
  const n = parseInt(p.get("slide"),10);
  if(n){
    document.body.classList.add("single");
    const el = document.querySelector(`.slide-${n}`);
    if(el) el.classList.add("active");
  }
}
render();
</script>
</body>
</html>
